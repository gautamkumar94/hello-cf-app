name: Build and Upload to SAP cTMS

on:
  push:
    branches:
      - main

jobs:
  build-and-transport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Cloud MTA Build Tool
        run: |
          npm ci
          npm install -g mbt

      - name: Build and verify MTAR archive
        run: |
          npx mbt build -t ./mta_archives
          unzip -l ./mta_archives/hello-cf-app_1.0.0.mtar

      - name: Upload MTAR to SAP cTMS
        uses: mauriciolauffer/deploy-to-sap-btp-with-ctms@main
        with:
          CTMS_TOKEN_SERVICE_URL: ${{ secrets.CTMS_TOKEN_URL }}
          CTMS_CLIENT_ID: ${{ secrets.CTMS_CLIENT_ID }}
          CTMS_CLIENT_SECRET: ${{ secrets.CTMS_CLIENT_SECRET }}
          CTMS_API_URL: ${{ secrets.CTMS_API_URL }}
          CTMS_NODE_NAME: ${{ secrets.CTMS_NODE_NAME }}
          CTMS_FILE_PATH: ./mta_archives/hello-cf-app_1.0.0.mtar
          CTMS_TR_DESCRIPTION: "GitHub Commit ${{ github.sha }}"
          CTMS_TR_CONTENT_TYPE: MTA
          CTMS_TR_STORAGE_TYPE: FILE