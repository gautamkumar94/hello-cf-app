name: Build and Upload to SAP cTMS

on:
  push:
    branches:
      - main

jobs:
  build-and-transport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Cloud MTA Build Tool
        run: |
          npm ci
          npm install -g mbt

      - name: Build and verify MTAR archive
        run: |
          mbt build -t ./mta_archives
          unzip -l ./mta_archives/hello-cf-app_1.0.0.mtar

      - name: Save MTAR as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtar-archive
          path: ./mta_archives/hello-cf-app_1.0.0.mtar

      - name: Upload MTAR to SAP cTMS via API
        env:
          CLIENT_ID: ${{ secrets.CTMS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CTMS_CLIENT_SECRET }}
          TOKEN_URL: ${{ secrets.CTMS_TOKEN_URL }}
          API_URL: ${{ secrets.CTMS_API_URL }}
          NODE_NAME: ${{ secrets.CTMS_NODE_NAME }}
        run: |
          echo "1. Getting OAuth Token..."
          AUTH_HEADER=$(printf '%s:%s' "$CLIENT_ID" "$CLIENT_SECRET" | base64 | tr -d '\n')
          
          TOKEN_RES=$(curl -s -X POST "${TOKEN_URL}?grant_type=client_credentials" \
            -H "Authorization: Basic $AUTH_HEADER" \
            -H "Content-Type: application/x-www-form-urlencoded")
          
          TOKEN=$(echo "$TOKEN_RES" | jq -r .access_token)
          
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Error: Failed to get OAuth token."
            echo "SAP Response: $TOKEN_RES"
            exit 1
          fi
          
          echo "Token retrieved successfully!"
          
          echo "2. Uploading MTAR file to cTMS..."
          # The fix is here: /v2/files/upload instead of /v2/files
          FILE_RES=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -F "file=@./mta_archives/hello-cf-app_1.0.0.mtar" "${API_URL}/v2/files/upload")
          HTTP_STATUS=$(echo "$FILE_RES" | tail -n1)
          FILE_BODY=$(echo "$FILE_RES" | sed '$d')
          
          if [ "$HTTP_STATUS" != "201" ]; then
            echo "Error: File upload failed with status $HTTP_STATUS"
            echo "Response: $FILE_BODY"
            exit 1
          fi
          
          FILE_ID=$(echo "$FILE_BODY" | jq -r .fileId)
          echo "Success! Uploaded File ID: $FILE_ID"
          
          echo "3. Creating Transport Request in node $NODE_NAME..."
          REQ_BODY=$(jq -n --arg desc "GitHub Commit ${{ github.sha }}" --arg fileId "$FILE_ID" --arg nodeName "$NODE_NAME" '{nodeName: $nodeName, contentType: "MTA", description: $desc, storageType: "FILE", entries: [{uri: $fileId}]}')
          
          TR_RES=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$REQ_BODY" "${API_URL}/v2/nodes/upload")
          TR_STATUS=$(echo "$TR_RES" | tail -n1)
          TR_BODY=$(echo "$TR_RES" | sed '$d')
          
          if [ "$TR_STATUS" != "201" ]; then
            echo "Error: Transport Request failed with status $TR_STATUS"
            echo "Response: $TR_BODY"
            exit 1
          fi
          
          echo "Transport Request Successfully Created!"