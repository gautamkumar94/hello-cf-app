name: Build and Upload to SAP cTMS

on:
  push:
    branches:
      - main

jobs:
  build-and-transport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Cloud MTA Build Tool
        run: |
          npm ci
          npm install -g mbt

      - name: Build and verify MTAR archive
        run: |
          mbt build -t ./mta_archives
          unzip -l ./mta_archives/hello-cf-app_1.0.0.mtar

      - name: Save MTAR as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtar-archive
          path: ./mta_archives/hello-cf-app_1.0.0.mtar

      - name: Upload MTAR to SAP cTMS via API
        run: |
          echo "1. Getting OAuth Token..."
          TOKEN_RES=$(curl -s -X POST "${{ secrets.CTMS_TOKEN_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${{ secrets.CTMS_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.CTMS_CLIENT_SECRET }}")
          
          TOKEN=$(echo "$TOKEN_RES" | jq -r .access_token)
          
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Error: Failed to get OAuth token."
            echo "SAP Response: $TOKEN_RES"
            echo "Check your GitHub Secrets! Make sure there are NO quotation marks or spaces in CTMS_CLIENT_ID or CTMS_CLIENT_SECRET."
            exit 1
          fi
          
          echo "Token retrieved successfully!"
          
          echo "2. Uploading MTAR file to cTMS..."
          FILE_RES=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -F "file=@./mta_archives/hello-cf-app_1.0.0.mtar" "${{ secrets.CTMS_API_URL }}/v2/files")
          HTTP_STATUS=$(echo "$FILE_RES" | tail -n1)
          FILE_BODY=$(echo "$FILE_RES" | sed '$d')
          
          if [ "$HTTP_STATUS" != "201" ]; then
            echo "Error: File upload failed with status $HTTP_STATUS"
            echo "Response: $FILE_BODY"
            exit 1
          fi
          
          FILE_ID=$(echo "$FILE_BODY" | jq -r .fileId)
          echo "Success! Uploaded File ID: $FILE_ID"
          
          echo "3. Creating Transport Request in node ${{ secrets.CTMS_NODE_NAME }}..."
          REQ_BODY=$(jq -n --arg desc "GitHub Commit ${{ github.sha }}" --arg fileId "$FILE_ID" --arg nodeName "${{ secrets.CTMS_NODE_NAME }}" '{nodeName: $nodeName, contentType: "MTA", description: $desc, storageType: "FILE", entries: [{uri: $fileId}]}')
          
          TR_RES=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$REQ_BODY" "${{ secrets.CTMS_API_URL }}/v2/nodes/${{ secrets.CTMS_NODE_NAME }}/transportRequests")
          TR_STATUS=$(echo "$TR_RES" | tail -n1)
          TR_BODY=$(echo "$TR_RES" | sed '$d')
          
          if [ "$TR_STATUS" != "201" ]; then
            echo "Error: Transport Request failed with status $TR_STATUS"
            echo "Response: $TR_BODY"
            exit 1
          fi
          
          echo "Transport Request Successfully Created!"